[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "illusion-rnn"
version = "1.0.0"
description = "A neurogym testbed for studying Transformational Apparent Motion (TAM) in recurrent neural networks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sharif Saleki" }]
requires-python = ">=3.10"
dependencies = [
    "neurogym>=2.3",
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter",
    "nbconvert",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["illusion_rnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model; excluded from the default CI run"]
addopts = "-m 'not slow'"
